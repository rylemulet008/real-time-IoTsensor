<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-Time IoT Sensor Data</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #777777;
    --line: #e5e5e5;
    --x: #d1495b;
    --y: #00798c;
    --z: #e0a030;
    --ok: #2a9d62;
    --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --ink: #eeeeee;
      --muted: #8a8a8a;
      --line: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 48px; }

  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 4px; }
  .status { display: flex; align-items: center; gap: 6px; margin: 0 0 32px; color: var(--muted); font-size: 0.9rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .status.on .dot { background: var(--ok); }

  .readouts { display: flex; gap: 32px; margin-bottom: 32px; }
  .axis { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .value { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .unit { color: var(--muted); font-size: 0.85rem; margin-left: 4px; }

  .chartbox { position: relative; height: 260px; }
  .meta { margin: 16px 0 0; color: var(--muted); font-size: 0.85rem; }

  @media (max-width: 480px) {
    .readouts { gap: 20px; }
    .value { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Real-Time IoT Sensor Data</h1>
  <p id="status" class="status" role="status"><span class="dot"></span><span id="statusText">Connecting…</span></p>

  <div class="readouts" aria-label="Latest accelerometer values">
    <div><div class="axis"><span class="swatch" style="background:var(--x)"></span>X</div><div class="value"><span id="vx">–</span><span class="unit">m/s²</span></div></div>
    <div><div class="axis"><span class="swatch" style="background:var(--y)"></span>Y</div><div class="value"><span id="vy">–</span><span class="unit">m/s²</span></div></div>
    <div><div class="axis"><span class="swatch" style="background:var(--z)"></span>Z</div><div class="value"><span id="vz">–</span><span class="unit">m/s²</span></div></div>
  </div>

  <div class="chartbox"><canvas id="chart" aria-label="Line chart of the last 30 accelerometer readings"></canvas></div>
  <p class="meta">Last update: <span id="time">waiting for data…</span></p>
  <p class="meta" id="hint"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrPKFCo2oDLbDygMCX-ASxTlpBdMdswg0",
    authDomain: "iotsensor-mulet.firebaseapp.com",
    databaseURL: "https://iotsensor-mulet-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "iotsensor-mulet",
    storageBucket: "iotsensor-mulet.firebasestorage.app",
    messagingSenderId: "39895531110",
    appId: "1:39895531110:web:e7b9194cfeea1b242437a7"
  };

  const MAX_POINTS = 30;
  const $ = (id) => document.getElementById(id);

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ---- Chart (the page still works if Chart.js fails to load) ----
  let chart = null;
  if (window.Chart) {
    const style = getComputedStyle(document.documentElement);
    const color = (name) => style.getPropertyValue(name).trim();
    const dataset = (label, c) => ({ label, data: [], borderColor: c, borderWidth: 2, pointRadius: 0, tension: 0.3 });
    const grid = { color: color("--line") };
    const ticks = { color: color("--muted") };
    chart = new Chart($("chart"), {
      type: "line",
      data: {
        labels: [],
        datasets: [dataset("X", color("--x")), dataset("Y", color("--y")), dataset("Z", color("--z"))]
      },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { ...ticks, maxTicksLimit: 5 } },
          y: { grid, ticks }
        }
      }
    });
  }

  function fmt(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n.toFixed(2) : "–";
  }

  // ---- Connection indicator ----
  onValue(ref(db, ".info/connected"), (snap) => {
    const online = snap.val() === true;
    $("status").classList.toggle("on", online);
    $("statusText").textContent = online ? "Connected" : "Offline, reconnecting…";
  });

  // ---- Live sensor data ----
  let lastTime = null;
  onValue(
    ref(db, "sensor"),
    (snap) => {
      const d = snap.val();
      if (!d) return;

      $("vx").textContent = fmt(d.x);
      $("vy").textContent = fmt(d.y);
      $("vz").textContent = fmt(d.z);
      if (d.time !== undefined) $("time").textContent = String(d.time);
      $("hint").textContent = "";

      // The app writes "time" last, so a new time value means one complete new reading.
      if (chart && d.time !== undefined && d.time !== lastTime) {
        lastTime = d.time;
        const label = String(d.time).slice(-8); // HH:mm:ss
        chart.data.labels.push(label);
        [d.x, d.y, d.z].forEach((v, i) => chart.data.datasets[i].data.push(Number(v)));
        if (chart.data.labels.length > MAX_POINTS) {
          chart.data.labels.shift();
          chart.data.datasets.forEach((ds) => ds.data.shift());
        }
        chart.update();
      }
    },
    (error) => {
      $("hint").textContent = "Could not read data: " + error.message + ". Check your database rules.";
    }
  );
</script>
</body>
</html>
